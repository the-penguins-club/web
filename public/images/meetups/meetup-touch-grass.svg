<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#071912"/>
  <defs>
    <radialGradient id="grassGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="grassBladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="natureGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#064e3b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Ambient Glow & Pattern -->
  <rect width="800" height="500" fill="url(#natureGrid)"/>
  <rect width="800" height="500" fill="url(#grassGlow)"/>

  <!-- Grass Blades Silhouettes at bottom -->
  <g fill="url(#grassBladeGrad)">
    <path d="M 0 500 C 30 430, 50 420, 60 500 Z"/>
    <path d="M 40 500 C 70 410, 90 400, 110 500 Z"/>
    <path d="M 90 500 C 130 390, 140 400, 160 500 Z"/>
    <path d="M 150 500 C 180 420, 200 410, 220 500 Z"/>
    <path d="M 210 500 C 240 380, 270 390, 290 500 Z"/>
    <path d="M 280 500 C 310 430, 330 420, 350 500 Z"/>
    <path d="M 340 500 C 370 400, 400 390, 420 500 Z"/>
    <path d="M 410 500 C 440 410, 470 420, 490 500 Z"/>
    <path d="M 480 500 C 510 370, 540 380, 560 500 Z"/>
    <path d="M 550 500 C 580 410, 610 420, 630 500 Z"/>
    <path d="M 620 500 C 660 390, 680 400, 710 500 Z"/>
    <path d="M 700 500 C 730 420, 750 410, 770 500 Z"/>
    <path d="M 760 500 C 780 400, 800 420, 820 500 Z"/>
  </g>

  <!-- Super Event Glowing Badge -->
  <g transform="translate(100, 28)">
    <rect width="180" height="28" rx="14" fill="#047857" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2"/>
    <text x="90" y="19" fill="#ecfdf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">🌿 SUPER EVENT • UNPLUGGED</text>
  </g>

  <!-- Terminal Window Graphic -->
  <g transform="translate(100, 70)">
    <rect width="600" height="360" rx="16" fill="#0a2319" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Top bar -->
    <rect width="600" height="42" rx="16" fill="#041810"/>
    <circle cx="28" cy="21" r="6" fill="#ef4444"/>
    <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="21" r="6" fill="#10b981"/>
    <text x="300" y="26" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">penguins@nature: /dev/ramna-park$</text>
    
    <!-- Code & Content -->
    <text x="36" y="86" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">$ sudo touch /dev/grass --unplugged --reconnect-humanity</text>
    
    <text x="36" y="122" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="14">[✓] System Status: Laptops Unplugged • Sunlight Activated</text>
    <text x="36" y="152" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="14">[+] Mesh Network: LoRa / Meshtastic P2P Nodes Online</text>
    <text x="36" y="182" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14">[+] Key-Signing: GPG Fingerprints Exchanged in Open Air</text>
    <text x="36" y="212" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14">[+] Knowledge Mirror: Kiwix Offline Wikipedia on Raspberry Pi</text>
    <text x="36" y="242" fill="#fef08a" font-family="'JetBrains Mono', monospace" font-size="14">[+] Activities: Acoustic Talks • Lawn Picnic • Sunset Frisbee</text>

    <text x="36" y="286" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="14">📍 Location: Ramna Park Lake Amphitheatre, Dhaka</text>
    <text x="36" y="316" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14">🌿 100% Free • Open to All Humans &amp; Friendly Daemons</text>
    <text x="36" y="342" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16">_</text>
  </g>
</svg>
