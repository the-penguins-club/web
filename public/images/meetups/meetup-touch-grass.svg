<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <title>Touch Grass: the Penguins Club mascot on a picnic blanket in Ramna Park, under a banyan tree, with a LoRa mesh antenna and a flying frisbee</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff3dc"/>
      <stop offset="1" stop-color="#f0fbc4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="650" cy="108" r="76" fill="#ff9d80" opacity="0.28"/>
  <circle cx="650" cy="108" r="52" fill="#ff9d80"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="190" cy="92" rx="52" ry="16"/><ellipse cx="226" cy="80" rx="34" ry="16"/><ellipse cx="160" cy="82" rx="26" ry="12"/>
    <ellipse cx="460" cy="62" rx="44" ry="13"/><ellipse cx="488" cy="52" rx="28" ry="13"/>
  </g>

  <!-- hills -->
  <path d="M0 330 Q150 255 300 312 T600 302 T800 290 V500 H0Z" fill="#a7f3d0"/>
  <path d="M0 382 Q200 304 420 372 T800 342 V500 H0Z" fill="#34d399"/>
  <path d="M0 432 Q250 392 500 428 T800 412 V500 H0Z" fill="#0a7a5a"/>

  <!-- banyan tree -->
  <g stroke="#6b4a2f" stroke-width="5" stroke-linecap="round">
    <line x1="92" y1="262" x2="92" y2="410"/><line x1="122" y1="268" x2="122" y2="418"/>
    <line x1="196" y1="268" x2="196" y2="418"/><line x1="228" y1="260" x2="228" y2="408"/>
  </g>
  <rect x="148" y="236" width="34" height="190" rx="10" fill="#6b4a2f"/>
  <ellipse cx="160" cy="214" rx="128" ry="88" fill="#0a7a5a"/>
  <circle cx="98" cy="214" r="42" fill="#10b981"/>
  <circle cx="170" cy="168" r="46" fill="#10b981"/>
  <circle cx="226" cy="224" r="40" fill="#34d399"/>
  <circle cx="130" cy="256" r="26" fill="#34d399"/>

  <!-- LoRa mesh antenna -->
  <line x1="350" y1="418" x2="350" y2="252" stroke="#0f1a16" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="418" x2="350" y2="392" stroke="#0f1a16" stroke-width="4" stroke-linecap="round"/>
  <line x1="368" y1="418" x2="350" y2="392" stroke="#0f1a16" stroke-width="4" stroke-linecap="round"/>
  <circle cx="350" cy="244" r="9" fill="#d4f55a" stroke="#0f1a16" stroke-width="4"/>
  <g stroke="#0f1a16" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M326 228 Q350 202 374 228"/><path d="M312 214 Q350 172 388 214"/>
  </g>

  <!-- frisbee -->
  <g transform="rotate(-16 470 176)">
    <ellipse cx="470" cy="176" rx="30" ry="9" fill="#d4f55a" stroke="#0f1a16" stroke-width="4"/>
    <ellipse cx="470" cy="173" rx="16" ry="3.5" fill="#0f1a16" opacity="0.18"/>
  </g>
  <g stroke="#0f1a16" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="420" y1="196" x2="438" y2="190"/><line x1="408" y1="210" x2="432" y2="203"/>
  </g>

  <!-- picnic blanket -->
  <polygon points="430,408 706,408 750,462 384,462" fill="#ff9d80"/>
  <g stroke="#ffffff" stroke-width="5" opacity="0.55">
    <line x1="500" y1="408" x2="476" y2="462"/><line x1="570" y1="408" x2="560" y2="462"/>
    <line x1="640" y1="408" x2="644" y2="462"/><line x1="410" y1="428" x2="738" y2="428"/>
    <line x1="398" y1="446" x2="742" y2="446"/>
  </g>

  <!-- penguin -->
  <ellipse cx="524" cy="388" rx="10" ry="28" transform="rotate(14 524 388)" fill="#0f1a16"/>
  <ellipse cx="596" cy="388" rx="10" ry="28" transform="rotate(-14 596 388)" fill="#0f1a16"/>
  <ellipse cx="560" cy="380" rx="40" ry="54" fill="#0f1a16"/>
  <ellipse cx="560" cy="392" rx="25" ry="40" fill="#ffffff"/>
  <circle cx="548" cy="352" r="6" fill="#ffffff"/><circle cx="572" cy="352" r="6" fill="#ffffff"/>
  <circle cx="549" cy="353" r="3" fill="#0f1a16"/><circle cx="571" cy="353" r="3" fill="#0f1a16"/>
  <polygon points="551,362 569,362 560,376" fill="#f59e0b"/>
  <rect x="526" y="372" width="68" height="11" rx="5.5" fill="#d4f55a"/>
  <ellipse cx="544" cy="436" rx="14" ry="6" fill="#f59e0b"/><ellipse cx="576" cy="436" rx="14" ry="6" fill="#f59e0b"/>

  <!-- closed laptop with sticker, and a flask -->
  <rect x="624" y="420" width="64" height="12" rx="3" fill="#e5eae8" stroke="#0f1a16" stroke-width="3"/>
  <circle cx="656" cy="426" r="4" fill="#34d399"/>
  <rect x="448" y="404" width="18" height="34" rx="6" fill="#ffffff" stroke="#0f1a16" stroke-width="3"/>
  <rect x="450" y="398" width="14" height="8" rx="3" fill="#0a7a5a"/>

  <!-- grass tufts and flowers -->
  <g stroke="#34d399" stroke-width="4" stroke-linecap="round">
    <path d="M40 470 l-6 -18 M40 470 l0 -22 M40 470 l7 -18"/><path d="M300 480 l-6 -16 M300 480 l0 -20 M300 480 l7 -16"/>
    <path d="M770 476 l-6 -16 M770 476 l0 -20 M770 476 l7 -16"/>
  </g>
  <g>
    <circle cx="90" cy="472" r="5" fill="#ffffff"/><circle cx="90" cy="472" r="2" fill="#f59e0b"/>
    <circle cx="340" cy="482" r="5" fill="#ff9d80"/><circle cx="340" cy="482" r="2" fill="#ffffff"/>
    <circle cx="238" cy="466" r="5" fill="#ffffff"/><circle cx="238" cy="466" r="2" fill="#f59e0b"/>
  </g>

  <!-- label -->
  <rect x="24" y="24" width="214" height="30" rx="15" fill="#0f1a16"/>
  <text x="40" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.8" fill="#d4f55a">SUPER EVENT • UNPLUGGED</text>
</svg>
