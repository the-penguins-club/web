<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Deep Hacktoberfest Background -->
  <rect width="800" height="500" fill="#120c1f"/>
  <defs>
    <radialGradient id="hackGlow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#120c1f" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="hackGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e1a47" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hackGrid)"/>
  <rect width="800" height="500" fill="url(#hackGlow)"/>

  <!-- Top Badge -->
  <g transform="translate(100, 28)">
    <rect width="240" height="28" rx="14" fill="#6b21a8" fill-opacity="0.8" stroke="#f97316" stroke-width="1.2"/>
    <text x="120" y="19" fill="#ffedd5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">🎃 HACKTOBERFEST 2026 SPECIAL</text>
  </g>

  <!-- Terminal Window Graphic -->
  <g transform="translate(100, 70)">
    <rect width="600" height="360" rx="16" fill="#1e1330" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Top bar -->
    <rect width="600" height="42" rx="16" fill="#130924"/>
    <circle cx="28" cy="21" r="6" fill="#ef4444"/>
    <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="21" r="6" fill="#10b981"/>
    <text x="300" y="26" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">thepenguinsclub@sprint: ~/hacktoberfest-2026</text>
    
    <!-- Code & Content -->
    <text x="36" y="86" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">$ gh pr create --title="feat: penguins-club-upstream" --label="hacktoberfest-accepted"</text>
    
    <text x="36" y="122" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="14">[✓] Git Fork &amp; Branch: Ready for upstream review</text>
    <text x="36" y="152" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="14">[+] Mentorship: 1-on-1 pairing with experienced maintainers</text>
    <text x="36" y="182" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14">[✓] Quality Focus: Clean commits, zero spam, genuine value</text>
    <text x="36" y="212" fill="#fed7aa" font-family="'JetBrains Mono', monospace" font-size="14">[+] Swag Station: Official TPC stickers, patches &amp; booklets</text>
    <text x="36" y="242" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14">[★] Status: Pull Request merged into upstream repository!</text>

    <!-- Visual Git Branch Graphic -->
    <g transform="translate(36, 275)">
      <line x1="10" y1="20" x2="380" y2="20" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 2"/>
      <path d="M 60 20 Q 90 20, 110 50 L 320 50 Q 340 50, 360 20" fill="none" stroke="#ec4899" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="5" fill="#f97316"/>
      <circle cx="60" cy="20" r="5" fill="#f97316"/>
      <circle cx="160" cy="50" r="5" fill="#ec4899"/>
      <circle cx="260" cy="50" r="5" fill="#ec4899"/>
      <circle cx="360" cy="20" r="6" fill="#22c55e"/>
      <text x="375" y="24" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">MERGED #2026</text>
    </g>

    <text x="36" y="345" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="16">_</text>
  </g>
</svg>
